name: Build and Deploy (production)

# Translations live in the repository under locales/ and are committed by
# Weblate, so the build is a plain `npm ci && npm run build` -- there is no
# translation API call and no token needed at build time.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SITE_NAME: "Safetag"

    steps:
      # Weblate commits one push per language, so several can land in quick
      # succession; only the newest deploy is worth finishing.
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and lint
        run: |
          npm ci
          npm run lint

      - name: Build
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: guide
          folder: public
          clean: true # Automatically remove deleted files from the deploy branch
